name: cms

services:
  wildfly:
    image: course-management-system-wildfly:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_HTTP_PORT:-8080}:8080"
    environment:
      POSTGRES_HOST: student-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${STUDENT_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SQLSERVER_HOST: enrollment-db
      SQLSERVER_PORT: "1433"
      SQLSERVER_DB: ${ENROLLMENT_DB}
      SQLSERVER_USER: ${SQLSERVER_USER}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD}
      ORACLE_HOST: course-db
      ORACLE_PORT: "1521"
      ORACLE_SERVICE: ${COURSE_DB}
      ORACLE_USER: ${ORACLE_APP_USER}
      ORACLE_PASSWORD: ${ORACLE_APP_PASSWORD}
    depends_on:
      student-db:
        condition: service_healthy
      enrollment-db:
        condition: service_healthy
      enrollment-db-init:
        condition: service_completed_successfully
      course-db:
        condition: service_healthy
    networks:
      - docker-net
    restart: unless-stopped

  enrollment-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "/scripts/init-sqlserver.sh"]
    environment:
      SQLSERVER_SA_USER: sa
      SQLSERVER_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
      ENROLLMENT_DB: ${ENROLLMENT_DB}
      SQLSERVER_USER: ${SQLSERVER_USER}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD}
    volumes:
      - ./docker/sqlserver/init-sqlserver.sh:/scripts/init-sqlserver.sh:ro
    depends_on:
      enrollment-db:
        condition: service_healthy
    networks:
      - docker-net
    restart: "no"

  student-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${STUDENT_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - student_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docker-net
    restart: unless-stopped

  enrollment-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    ports:
      - "${SQLSERVER_HOST_PORT}:1433"
    volumes:
      - enrollment_db_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - docker-net
    restart: unless-stopped

  course-db:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${ORACLE_APP_USER}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD}
      ORACLE_DATABASE: ${COURSE_DB}
    ports:
      - "${ORACLE_HOST_PORT}:1521"
    volumes:
      - course_db_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - docker-net
    restart: unless-stopped

volumes:
  student_db_data:
  enrollment_db_data:
  course_db_data:

networks:
  docker-net:
    name: docker-net
    driver: bridge
